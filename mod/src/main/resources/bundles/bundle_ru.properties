st.image.code = Копировать программы (разделены комментариями процессоров)
st.image.cancelled = Преобразование отменено.
st.image.error.file = Не удалось прочитать изображение либо файл больше 16 МиБ.
st.image.error.png = Повреждённое изображение или неподдерживаемое кодирование. Поддерживаются PNG, обычный/прогрессивный JPEG и BMP 24/32 бит.
st.image.error.size = Превышены размеры исходного изображения или 1 048 576 выходных пикселей.
st.image.error.options = Неверный дисплей, число панелей или шаг цвета.
st.image.error.space = Не хватает места под процессоры в радиусе связи. Уменьшите число дисплеев, упростите картинку или увеличьте шаг цвета.
st.image.error.code = Программа превысила штатный предел конфигурации.
st.quick-schematics = Быстрые схемы по тегу
st.quick-schematics-help = Укажите точный тег (пусто — все). Нажатие на схему зданий запускает штатное размещение. Тег сохраняется; клавиша задаётся в настройках мода. Схемы ландшафта применяются через полную библиотеку с подтверждением хоста.
st.selection.title = Выделить
st.selection.help = Зажмите левую кнопку мыши и выделите область видимой карты. Отпустите для захвата; Escape отменяет. Слой выбирается до открытия этого окна. Масштаб и положение камеры настройте заранее; для больших областей можно ввести координаты клеток.
st.rules-live-title = Правила мира
st.rules-live-help = Это общие правила мира, а не местные визуальные настройки. Хост передаёт изменения всем участникам. Числа задают абсолютные множители; изменение здоровья не гарантирует лечение существующих объектов. Интервал волн влияет на будущие отсчёты. Командные множители босса действуют отдельно.
st.rules-live-warning = Применить это правило мира в текущем матче?
st.rule.range = Диапазон: {0}–{1}.
st.rule.fog = Туман войны
st.rule.lighting = Освещение мира
st.rule.border_darkness = Затемнение границ мира
st.rule.schematics = Разрешить схемы
st.rule.possession = Управление юнитами игроком
st.rule.waves = Волны
st.rule.wave_timer = Автоматический таймер волн
st.rule.infinite_resources = Бесконечные ресурсы
st.rule.instant_build = Мгновенное строительство
st.rule.fire = Огонь
st.rule.reactor_explosions = Взрывы реакторов
st.rule.unit_cap_disabled = Отключить лимит юнитов
st.rule.build_speed = Множитель скорости строительства
st.rule.build_cost = Множитель стоимости строительства
st.rule.unit_damage = Множитель урона юнитов
st.rule.unit_health = Множитель здоровья юнитов
st.rule.block_damage = Множитель урона построек
st.rule.block_health = Множитель здоровья построек
st.rule.wave_seconds = Интервал волн (секунды)
st.rule.unit_cap = Базовый лимит юнитов
st.visual.display-borderless = Местное изображение дисплеев поверх рамок
st.visual.block-status = Индикаторы потребления и отключения построек
st.visual.rules-help = Туман, затемнение границ и освещение мира являются общими правилами. Их меняет хост в окне «Правила мира». На чужом сервере местные слои учитывают видимость.
st.settings.welcome = Показывать короткое приветствие
st.settings.wave-notice = Уведомлять о следующей волне
st.settings.view-custom = Настроить скорость камеры и пределы масштаба
st.settings.view-help = Множители 1–5 применяются к текущим штатным значениям камеры. Отключение возвращает исходные значения. Расширение масштаба может увеличить нагрузку отрисовки.
st.settings.pan-speed = Множитель скорости камеры
st.settings.zoom-out = Множитель отдаления
st.settings.zoom-in = Множитель приближения
st.wave.notice = Следующая волна: {0}. Подробности — в прогнозе волны.
st.welcome = Scheme-Size: инструменты — S+/SG слева; клавиши — в настройках.
st.build.outline = Только контур (квадрат/окружность)
st.build.replace-rebuild = Демонтировать и заменить
st.build.replace-rebuild-warning = Несовместимые блоки одного размера сначала разбираются штатной очередью, затем строятся заново на свободном месте. Предметы, жидкости и затраченные ресурсы не сохраняются. Отмена прекращает новые заявки на восстановление, но не уже завершённое строительство. Смена юнита или карты прекращает отслеживание.
st.build.replacement-pending = Ожидают замены: {0} клеток.
st.build.replacement-cancel = Остановить замену
st.build.error.replacement-active = Сначала завершите или отмените текущую замену.
st.build.replace-refused = Правила отказали в повторной постройке в ({0}, {1}). Исходный блок уже разобран; при необходимости восстановите его вручную.
st.schematic.dense-warning = В полной схеме больше 16 384 планов. Штатный preview, перемещение и размещение могут задержать или замедлить игру. Можно использовать участки. Открыть цельный штатный preview?
st.schematic.batch-idle = Вставка ландшафта не запланирована.
st.schematic.batch-running = Вставка ландшафта: применено пакетов {0}/{1}.
st.schematic.batch-done = Вставка завершена: пакетов {0}/{1}.
st.schematic.batch-cancelled = Вставка отменена после {0}/{1} пакетов. Уже применённое остаётся.
st.schematic.batch-conflict = Вставка остановлена на {0}/{1}: изменился мир, право, частота или клетки. Уже применённое остаётся.
st.schematic.batch-cancel = Отменить оставшиеся пакеты ландшафта
st.schematic.batch-confirm = Применить {0} изменённых клеток за {1} пакетов? До 4096 клеток на пакет, один пакет за 300 мс, с повторной проверкой. Отмена прекращает оставшееся; уже применённое остаётся. Отменить можно только последние 16 пакетов.
st.schematic.section-help = Необязательные участки до 128×128 уменьшают нагрузку preview. X/Y — смещение в оригинале. Здание относится к участку со своей опорной клеткой, даже если его край выходит наружу. Сохраняйте исходные смещения при размещении участков и проверяйте связи между ними.
st.schematic.section = Открыть участок
st.schematic.section-back = Вернуться к полной схеме
st.player-cycle-team = Смена команд по кругу
st.player-cycle-warning = Команда игрока будет меняться каждую секунду. Это влияет на врагов, строительство и принадлежность юнита. Повторное нажатие вернёт исходную команду. Запуск босса останавливает активную смену команд. Используйте при подготовке матча.
st.update.title = Обновления
st.update.help = Канал релизов проекта пока не опубликован. Указывайте GitHub owner/repository только для доверенного владельца и артефакта. Проверка выполняется вручную и обращается к GitHub; скачивание и установка требуют отдельных подтверждений. Нужны JAR текущей редакции и SHA-256 в релизе. Можно проверить и импортировать локальный JAR. Закрытие окна отменяет публикацию результата текущей проверки.
st.update.source = GitHub owner/repository
st.update.check = Проверить последний релиз
st.update.local = Проверить локальный JAR обновления
st.update.busy = Выполняется…
st.update.download = Скачать и проверить кандидат
st.update.download-warning = Скачать этот кандидат из выбранного источника? Скачивание не устанавливает мод.
st.update.install-warning = Установить исполняемый мод штатным менеджером игры? Код получит такие же права, как другие Java-моды. Проверьте источник и редакцию. Нужен перезапуск. Сохраните резервную копию прежнего JAR.
st.update.restart = Импортировано штатным менеджером модов. Перезапустите Mindustry для применения.
st.update.error.source = Неверный источник. Нужны GitHub owner/repository и HTTPS-артефакты релизов с поддерживаемых доменов GitHub.
st.update.error.data = Повреждённые сведения о релизе.
st.update.error.digest = Нет SHA-256 либо не совпадают хеш, размер или содержимое кандидата.
st.update.error.asset = В последнем релизе нет JAR с ожидаемым именем этой редакции.
st.update.error.file = Повреждённый JAR, опасный путь в архиве, превышение размера или включённые классы игры.
st.update.error.edition = Метаданные не соответствуют редакции, её входному классу или версии игры.
st.update.error.network = Сервис обновлений недоступен, запрос не выполнен или истёк таймаут. Другие инструменты остаются доступны.
st.update.error.size = Обновление превышает допустимый размер.
st.editor.resize = Размер карты редактора
st.editor.resize-help = Доступно только при открытом штатном редакторе карты без сетевого сеанса. Размеры 50–5000 по стороне; доступная память JVM дополнительно ограничивает число клеток. Используется MapEditor, операция может занять время. Оценка консервативная и не гарантирует наличие памяти GPU/ОС. Штатные пределы других окон глобально не меняются.
st.editor.resize-warning = Изменить размер текущего буфера редактора? Обрезанные клетки и история отмены могут быть потеряны. Сначала экспортируйте резервную копию штатным редактором. Автоматическое сохранение карты не выполняется.
st.editor.resize-error = Редактор недоступен, координаты неверны либо превышен расчётный бюджет памяти. Уменьшите размер карты.
st.peer.unknown = Нет сведений о моде
st.peer.share = Обмениваться метками редакции и подписью с совместимым хостом
st.peer.help = Необязательный обмен редакцией и подписью, по умолчанию выключен; включает ограниченный адаптер старого протокола O279. Метка — заявление клиента, а не удостоверение личности или право. Ванильным клиентам мод не нужен. Нет ответа — статус неизвестен. Проверка с оригинальным бинарником O279 требует совместимой версии игры.
st.unit-tools = Юниты на карте
st.unit-tools-help = Показаны ближайшие 100 подходящих юнитов. Для штатного управления нужен свободный управляемый юнит своей команды и разрешение сервера. Удаление хостом — отдельное действие. Найдите тип или числовой ID и выберите юнит.
st.unit-tools-control = Управлять юнитом
st.unit-tools-requested = Штатный запрос управления отправлен. Удалённый сервер может отказать.
st.unit-tools-missing = Юнит больше недоступен или не виден.
st.unit-tools-control-denied = Управление запрещено либо юнит занят, неуправляем, скрыт или принадлежит другой команде.
st.keys.original = Клавиши O279
st.keys.original-warning = Назначить F12 — панель, Y — визуальные слои, G — быстрые схемы, F7 — ядро, I — AI, F2 — юниты, F3 — инструменты своего игрока, F4 — ресурсы? Возможны совпадения с ванильными клавишами и другими модами. Штатные привязки не удаляются. Проверьте конфликты ниже и при необходимости переназначьте клавиши. Заменяются только эти привязки мода.
st.settings.distributor = Управляемый распределитель у хоста (нужен перезапуск)
st.settings.distributor-warning = После перезапуска создаваемые у этого хоста распределители можно контролировать как маршрутизаторы. Направленная передача ограничена соседними союзными зданиями, принимающими предмет. Сериализация сохранений остаётся штатной. Новая кнопка управления у ванильных гостей не появляется. Адаптер фабрики может конфликтовать с модами распределителей. Для возврата штатного поведения отключите настройку и перезапустите игру.
st.unit-tools-control-building = Управлять зданием в X/Y
st.claj.title = Комнаты CLaJ
st.claj.help = Нужен внешний relay с прежним протоколом CLaJ. Публичный сервис по умолчанию не выбран. Ссылки CLaJ требуют совместимого клиента/адаптера; обычным ванильным гостям подходит штатное подключение по IP или Steam-лобби. Этот транспорт не шифрует соединение. Совместимость реальных сервисов и WAN не проверена. Закрытие окна сохраняет созданные комнаты до явного закрытия или завершения хоста. До 4 комнат и 16 мостов на комнату; трафик пересылается по TCP в настоящий локальный сокет хоста.
st.claj.relay = Адрес и порт relay
st.claj.local-port = Фактический порт локального хоста игры
st.claj.create = Создать комнату relay
st.claj.create-warning = Обратиться к этому внешнему relay и создать комнату с пересылкой в ваш локальный игровой хост? Сервис видит адреса подключений и пересылаемый трафик. Проверьте владельца и фактический локальный порт. Создавайте комнаты только для собственного запущенного хоста.
st.claj.connecting = Ожидание ответа relay…
st.claj.copy = Копировать ссылку
st.claj.close = Закрыть комнату
st.claj.close-all = Закрыть все комнаты relay
st.claj.closed = Комната закрыта
st.claj.link = Готовая ссылка CLaJ
st.claj.parse = Проверить ссылку
st.claj.join = Войти в комнату relay
st.claj.join-warning = Покинуть текущую игру и подключиться к этому внешнему relay? Несохранённый прогресс одиночной игры может быть потерян. Текущий хост-матч сначала завершите штатным меню игры.
st.claj.error.link = Неверная ссылка прежнего протокола CLaJ, адрес или порт.
st.claj.error.data = Повреждённый или слишком большой пакет relay.
st.claj.error.host = Сначала запустите собственный игровой хост, проверьте локальный порт и лимит комнат. Вход в другую комнату при хостинге отключён.
st.claj.error.network = Relay отказал, отключился, не ответил вовремя или использует другой протокол. Закройте комнату и проверьте адрес/версию сервиса. Прямой хостинг игры остаётся доступен.
st.teams = Команды
st.teams-help = Текущие базовые команды и множители юнитов. Выберите команду и перейдите к игрокам, ресурсам или юнитам. Боевые настройки босса временно переопределяют множители выбранных команд на время события.
st.team-summary = {0}: игроков {1}, юнитов {2}, ядер {3}; здоровье юнитов ×{4}, урон ×{5}
keybind.schemesize-quick-schematics.name = Быстрые схемы по тегу
keybind.schemesize-unit-tools.name = Юниты на карте
keybind.schemesize-self-tools.name = Инструменты своего игрока
keybind.schemesize-items.name = Ресурсы ядра
keybind.schemesize-restore.name = Восстановить планы строительства
st.claj.error.name = Перед входом в комнату задайте имя игрока в штатных настройках игры.
st.stamp.title = Кисть построек
st.stamp.help = God заменяет занятые объекты целиком, даже если их края выходят за выделение. Маленькое выделение размещает один крупный блок. Отмена возвращает здания и запасы.
st.stamp.confirm = Разместить {0} блоков? Занятых объектов для замены: {1}.
st.stamp.error = Не удалось разместить блоки. Проверьте границы карты, команду и параметры.

st.actions.title=Найти действие
st.actions.empty=Нет подходящих включённых действий.
st.loadout.title=Наборы ресурсов
st.loadout.help=Задайте имя и точные количества (0–10000, до 64 предметов). Меняются только перечисленные предметы. Загрузка меняет форму. Сохранение заменяет набор с тем же именем. Автоматической отмены применения нет.
st.loadout.target=Цель: {0}, ядро в {1}, {2}
st.loadout.add=Добавить предмет
st.loadout.save=Сохранить локальный набор
st.loadout.confirm-save=Сохранить или заменить набор «{0}»?
st.loadout.confirm-apply=Задать {4} видов предметов из «{0}» для {1}, ядро в {2}, {3}? Точные количества показаны в форме. Текущие количества перечисленных предметов будут заменены.
st.loadout.confirm-delete=Удалить локальный набор «{0}»?
st.loadout.invalid=Наборы не прочитаны. Данные не перезаписаны; проверьте резервную копию настроек и доступность контента.
st.visual.power-laser-opacity=Видимость связей энергосети: {0}%
st.build.power-radius=Исключить ближние здания сети (клеток)
st.build.power-line=Запланировать линию к ближайшей энергосети
st.build.power-line-help=Выберите автоматически соединяемый энергоузел и начальные координаты. Линия создаёт обычные планы и требует ресурсов. Соседние здания и последующие изменения могут помешать автосвязи; проверьте готовую сеть.
st.build.power-line-confirm=Добавить {3} узлов в сторону «{0}», координаты {1}, {2}? Это обычная очередь строительства, мир сразу не изменится.
st.build.error.power-line=Выберите доступный автоматически соединяемый энергоузел, свободный неизолированный маршрут и радиус от 0 до 512.
st.build.error.power-target=Подходящее союзное здание энергосети не найдено или изменилось после расчёта.
st.build.error.power-search-limit=Поиск зданий энергосети достиг безопасного предела. Уменьшите число зданий поблизости или выберите другую начальную точку.

st.workspace.more = Другие инструменты

st.workspace.close = Закрыть инструмент · Esc

st.workspace.advanced = Дополнительно

st.workspace.point = Место на карте

st.workspace.selection-help = Выделите область на карте. Отпустите для просмотра. Enter / «Выбрать» подтверждает; Esc / правая кнопка отменяет.

st.workspace.confirm = Выбрать

st.workspace.spawn-confirm = Создать {1} × {0} в клетке {2}, {3}?

st.workspace.player-point = На карте

st.workspace.core-point = Ядро на карте

st.help.read = Что это делает?

st.short.layer = Слой

st.short.import = Импорт

st.short.light = Освещение

st.short.lasers = Связи: {0}%

st.short.player-info = Сведения

st.help.capture = Потяните мышью по карте. Отпустите для просмотра, Enter подтверждает, Esc отменяет. Мир не меняется.

st.help.layer = Выберите, что копировать: здания, планы, пол, руду или ландшафт. Затем выделите область.

st.help.import = Открывает импорт файла, текста из буфера или изображения. Исходный файл сохраняется.

st.help.clipboard = Читает схему Base64 из буфера обмена. Вставка на карту запускается отдельно.

st.help.image = Превращает изображение в схему с игровыми дисплеями и процессорами.

st.help.paste = Включает штатный предпросмотр схемы зданий. Разместите её на карте; правая кнопка отменяет. Действуют обычные права строительства.

st.help.terrain = Укажите левую нижнюю клетку вставки. Хост подтверждает изменение ландшафта; большие схемы применяются пакетами.

st.help.undo = Отменяет последние сохранённые изменения ландшафта. Изменённые после этого клетки защищены от перезаписи.

st.help.cancel-batch = Останавливает оставшиеся пакеты. Уже применённые изменения остаются на карте.

st.help.refresh = Заново читает библиотеку. Выбранная схема и введённые параметры сохраняются.

st.help.near = Задаёт область 5×5 вокруг вашего игрока. Копирование выполняется отдельной кнопкой.

st.help.save = Сохраняет новую копию в библиотеку мода с заданным именем и тегами.

st.help.export = Экспортирует выбранную схему. Кнопка файла открывает выбор места, кнопка буфера копирует Base64.

st.help.player-map = Нажмите клетку рядом с игроком и подтвердите. Выбирается ближайший игрок в пределах пяти клеток.

st.help.player-actions = Открывает действия над выбранным игроком: наблюдение, управление и доступные административные операции. Права проверяются повторно.

st.help.player-team = Выберите команду и подтвердите перевод выбранного игрока. Общий мир изменяет только хост.

st.help.player-info = Показывает команду, юнита и доступную метку выбранного игрока. Ничего не меняет.

st.help.lasers = Меняет прозрачность штатных линий энергосети только у вас. 0% скрывает линии.

st.short.visual.grid = Сетка

st.help.visual.grid = Показывает границы клеток на карте. Только у вас; правила матча не меняет.

st.short.visual.ruler = Линейка

st.help.visual.ruler = Показывает расстояние от вашего игрока до мыши в клетках. Только у вас; правила матча не меняет.

st.short.visual.unit-bars = Здоровье юнитов

st.help.visual.unit-bars = Показывает здоровье и боезапас видимых юнитов. Только у вас; правила матча не меняет.

st.short.visual.unit-range = Радиусы юнитов

st.help.visual.unit-range = Показывает дальность оружия видимых юнитов. Только у вас; правила матча не меняет.

st.short.visual.turret-range = Радиусы турелей

st.help.visual.turret-range = Показывает дальность видимых турелей. Только у вас; правила матча не меняет.

st.short.visual.reactor-range = Взрыв реактора

st.help.visual.reactor-range = Показывает область взрыва ядерного реактора. Только у вас; правила матча не меняет.

st.short.visual.boost-range = Ускорители

st.help.visual.boost-range = Показывает область действия ускорителей. Только у вас; правила матча не меняет.

st.short.visual.power-bars = Состояние энергии

st.help.visual.power-bars = Показывает удовлетворённость видимых энергосетей. Только у вас; правила матча не меняет.

st.short.visual.floor-xray = Пол под зданиями

st.help.visual.floor-xray = Рисует пол поверх зданий, чтобы видеть поверхность. Только у вас; правила матча не меняет.

st.short.visual.hide-units = Скрыть юнитов

st.help.visual.hide-units = Временно скрывает рисунки юнитов только у вас. Юниты продолжают двигаться и сражаться. Только у вас; правила матча не меняет.

st.short.visual.display-borderless = Дисплеи без рамок

st.help.visual.display-borderless = Рисует местное изображение дисплеев поверх их рамок. Только у вас; правила матча не меняет.

st.short.visual.block-status = Статусы зданий

st.help.visual.block-status = Показывает индикаторы потребления и отключения зданий. Только у вас; правила матча не меняет.

st.help.route-type = Тип движения для прогноза: наземный, шагающий, водный или парящий. Реальный AI может выбрать другой путь.

st.help.route-refresh = Пересчитывает линии после изменения карты. Линии видны только у вас.

st.short.routes-ready = Готово · {0}/{1} к ядру

st.help.close = Понятно

st.help.core-pick = Выбор ядра на карте или в списке. Изменяется выбранное ядро и его команда.

st.help.item-pick = Нажмите иконку ресурса в сетке. Есть поиск по названию.

st.short.item-delta = Изменение: + добавить, − убрать

st.help.item-apply = God позволяет превысить вместимость ядра. Количество не может стать отрицательным или переполнить целое число.

st.help.unit-pick = Выбор по иконке. God показывает также запрещённые и составные типы.

st.help.unit-spawn = Укажите клетку и подтвердите. God отключает лимит юнитов правилами матча, обходит запреты типа и среды. Для непроходимой точки находит свободную клетку рядом. До 1000 головных юнитов за операцию; составные создаются целиком.

st.help.unit-tools = Управление существующими юнитами.

st.help.unit-near = Выберите игрока и создайте юнитов рядом с ним.

st.help.build-block = Выбор блока по иконке. God также показывает запрещённые и закрытые блоки.

st.help.build-advanced = Координаты, размер, форма и обычные строительные операции. God: мгновенное размещение без расходов и проверки местности.

st.help.build-rotation = Поворот блока на 90 градусов.

st.help.build-shape = Прямоугольник или круг. Карта меняется после подтверждения.

st.short.instant = God: мгновенное размещение

st.short.instant-undo = Отменить размещение God

st.build.instant-confirm = Разместить {0} блоков без расходов? Занятых объектов для замены: {1}. Отмена вернёт прежнее состояние.

st.selection.title.help = Выделите область мышью. Enter — принять, Esc — отменить.

st.build.fill.help = Plus ставит обычные планы. God мгновенно размещает блоки; обычный режим доступен в дополнительных параметрах.

st.build.restore.help = Возвращает удалённые планы и конфигурацию. Содержимое зданий и ресурсы не возвращаются.

st.short.instant-undo.help = Возвращает состояние участка до размещения: здания, настройки и запасы. Последующие изменения в участке перезаписываются.

st.build.at-player.help = Подставить клетку игрока.

st.build.copy.help = Копировать блок, поворот и конфигурацию из указанной клетки.

st.build.replace.help = Подготовить планы замены соседних одинаковых блоков.

st.build.replace-rebuild.help = Обычная разборка и замена с расходом ресурсов.

st.build.replacement-cancel.help = Остановить ожидающую замену.

st.build.remove.help = Подготовить планы разборки связной группы.

st.build.remove-plans.help = Удалить группу строительных планов.

st.build.connect.help = Соединить совместимые энергетические узлы.

st.build.power-line.help = Подготовить обычную строительную линию к узлу.

st.build.withdraw.help = Запросить выбранный ресурс из здания.

st.build.deposit.help = Передать переносимые предметы зданию.

st.build.drop.help = Подтвердить уничтожение переносимых предметов.

st.build.priority-drop.help = Ожидать выбранный предмет для сброса.

st.build.priority-drop-cancel.help = Отменить ожидающий сброс.

st.loadout.name = Имя набора (для сохранения)

st.snapshot.too-large = Слишком много данных зданий для одной отмены. Уменьшите область.

st.help.god-undo = God возвращает затронутые объекты целиком, включая запасы. Последующие изменения в этой области перезаписываются.

st.help.overview = Открывает инструмент. Параметры сохраняются при переключении панелей.

st.settings.tab.interface = Экран

st.settings.tab.modules = Панели

st.settings.tab.keys = Ввод

st.settings.tab.other = Прочее

st.short.subtitle = Ваша подпись

st.routes.progress = Чтение карты: {0}%

st.player-tab-0 = Общее
st.player-tab-1 = Юнит
st.player-tab-2 = Права
st.units-select-area = Выбрать рамкой
st.units-kill-selected = Убить выбранных
st.units-kill-all = Убить всех, кроме игроков
st.units-kill-help = Рамка выбирает юнитов всех команд по положению центра. В списке можно отмечать несколько юнитов. Убийство вызывает обычную смерть: возможны взрывы, выпадение груза и события. Юниты игроков и их цепочки защищены; управление перепроверяется при подтверждении. Отмены нет.
st.units-kill-confirm = Убить юнитов: {0}? Юниты под управлением игроков будут пропущены. Возможны взрывы и урон постройкам. Отмены нет.
st.units-killed = Убито: {0}
st.units-empty = Нет подходящих юнитов.

st.help.player-copy = Копирует имя без цветовых кодов в буфер обмена.
st.help.player-watch = Камера следует за выбранным игроком. Управление его юнитом не передаётся.
st.help.player-unwatch = Возвращает камеру к вашему юниту.
st.help.player-building = Запрашивает штатное управление союзной турелью или другим управляемым зданием в X/Y. Доступно только для вас; правила управления определяет игра.
st.help.player-teleport = Перемещает юнит выбранного игрока в клетку X/Y. Координаты задаются выше; цель и права хоста проверяются при подтверждении.
st.help.player-to-me = Перемещает юнит выбранного игрока к вашему текущему положению.
st.help.player-type = Выбирает тип юнита для передачи игроку. Сам выбор ничего не создаёт.
st.help.player-replace = Создаёт выбранный тип и передаёт игроку управление. Его предыдущий юнит получает AI. Отмены нет.
st.help.player-kick = Отключает выбранного игрока штатным способом. Игрок сможет вернуться после установленной игрой задержки.
st.help.player-trace = Открывает штатные серверные сведения о выбранном игроке. Доступны только хосту.

st.units-selected-actions = Действия с юнитом

st.roster.tab-map = На карте
st.roster.tab-create = Создать
st.roster.team = Команда
st.roster.all-teams = Все команды
st.roster.all-types = Все типы
st.roster.types = Типы
st.roster.kill-matching = Убить подходящих
st.roster.individuals = Отдельные юниты
st.roster.more = Ещё 20
st.roster.help = Выберите команду и отметьте типы по иконкам. Можно выбрать несколько типов. Снятие последней отметки оставляет пустой фильтр. «Убить подходящих» действует на всю подходящую группу; рамка и отметки — на отдельных юнитов. Юниты игроков пропускаются повторно при исполнении. Смерть вызывает обычные взрывы и падение; отмены нет.
st.ui.dock-help = Показать или скрыть подписи разделов. На маленьком окне остаются иконки с подсказками.
