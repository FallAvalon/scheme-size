st.power.title = Информация об энергосети
st.power.help = Выберите здание с энергией по координатам клетки. Значения поступают из его текущей игровой энергосети и обновляются, пока окно открыто. Производство и потребление указаны в секунду; запас и ёмкость — в единицах энергии.
