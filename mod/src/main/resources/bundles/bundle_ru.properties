st.visual.floor-xray = Показывать пол поверх зданий
st.visual.hide-units = Скрыть изображения юнитов локально
st.visual.hide-warning = Скрытие временно убирает юниты из штатной группы рисования на каждый кадр и затем возвращает их. Другие визуальные слои могут по-прежнему показывать их. Возможны взаимодействия с другими модами, меняющими отрисовку.
