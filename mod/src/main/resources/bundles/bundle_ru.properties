st.player-remove-unit-warning = Удалить юнит этого игрока без взрыва? Предметы в нём будут потеряны. Режим «Босс-игрок» может засчитать удаление как смерть. Отмены нет.
st.player-effect = Эффект состояния
st.player-effect-help = Длительность в секундах (0,1–3600). Постоянные эффекты игры действуют до снятия. Активное событие может повторно наложить свой эффект.
st.player-effect-seconds = Секунды
st.player-effect-remove = Снять эффект
st.player-kick = Исключить игрока
st.player-ban = Заблокировать игрока
st.player-ban-warning = Заблокировать игрока штатным способом по UUID и IP? Блокировка сохраняется в административных данных этого хоста.
st.player-trace = Штатные сведения об игроке
st.player-admin-toggle = Права администратора
st.player-admin-warning = Изменить постоянные права администратора на вашем хосте? Администратору доступны мощные штатные серверные команды.
st.player-votekick = Голосование за исключение
st.player-votekick-reason = Укажите причину для отправки штатного запроса голосования.
st.player-votekick-unavailable = Нужен чужой сервер, не менее трёх игроков и союзник без прав администратора. Возможность голосования определяет сервер.
st.error.effect-immune = Выбранный юнит невосприимчив к этому эффекту.
st.error.remote-player = Нужен ваш работающий сетевой хост и подключённый удалённый игрок.
st.error.core-area = Осколку ядра нужен свободный сухой участок 3×3 без юнитов.
st.error.core-items = В последнем ядре остались предметы. Перед удалением явно опустошите его.
st.build.title = Строительство
st.build.help = ЛОКАЛЬНАЯ ОЧЕРЕДЬ СТРОИТЕЛЬСТВА. Заливка и кластеры используют обычные планы, ресурсы и права сервера. Координаты — клетки. До 1024 планов за раз. Восстановление возвращает планы и настройки; оно не возвращает содержимое зданий и затраченные ресурсы. Сервер может отказать в запросах предметов и соединений.
st.build.at-player = У моего игрока
st.build.block = Блок
st.build.copy = Копировать из клетки
