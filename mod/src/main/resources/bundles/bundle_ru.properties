st.visual.title = Слои
st.visual.help = Эти слои видны только здесь и не меняют правила матча. При сильном отдалении сетка и рентген показываются выборочно; отображаются не более 500 видимых юнитов и зданий. На чужом сервере неизвестные здания и юниты под fog исключены. Для производительности отключайте ненужные слои.
