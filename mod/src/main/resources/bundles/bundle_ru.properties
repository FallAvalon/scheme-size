st.schematic.layer.overlay = Руда
st.schematic.layer.terrain = Ландшафт
st.schematic.error.header = Файл не является поддерживаемой схемой (нужен заголовок msch версии 0 или 1).
st.schematic.error.tags = Некорректное название, теги или метаданные. Нужны название, до 64 тегов и ограниченные метаданные.
st.schematic.error.missing-content = Нужное содержимое отсутствует или не имеет безопасного соответствия в этой сборке игры. Импорт отклонён, исходник сохранён.
st.schematic.error.entries = Некорректные записи схемы или их количество.
st.schematic.error.dictionary = Некорректный словарь блоков либо более 128 разных блоков при экспорте — за пределом безопасного штатного чтения формата.
st.schematic.error.trailing = Лишние данные в конце содержимого схемы.
st.schematic.error.data = Не удалось прочитать или записать схему. Проверьте формат и её содержимое.
st.schematic.error.size = Превышен предел 16 МиБ в сжатом / 32 МиБ в распакованном виде либо слишком длинный ввод.
st.schematic.error.base64 = Некорректный Base64 схемы.
st.schematic.error.duplicate = Повторные записи в одном слое клетки не поддерживаются.
st.schematic.error.dimensions = Размер схемы должен быть от 1 до 512 клеток по каждой стороне.
st.schematic.error.selection = Выберите прямоугольник внутри карты до 512×512, включая полный размер выбранных зданий.
st.schematic.error.terrain-place = Для схем ландшафта нужна отдельная вставка хостом.
st.schematic.error.mixed = Файл смешивает неподдерживаемые слои зданий и среды. Выберите отдельный слой.
st.schematic.error.library-full = Отдельная библиотека ограничена 256 файлами. Перед новым импортом архивируйте копии.
st.schematic.error.file = Файл недоступен, слишком большой, является ссылкой, повреждён либо уже существует. Экспорт не перезаписывает существующие файлы.
st.routes.title = Прогноз маршрутов врагов
st.routes.help = ЛОКАЛЬНЫЕ ЛИНИИ — общая функция Plus и God. Прогноз от первых 32 точек появления к известным вражеским ядрам с ценами ландшафта Build 160.7 и путём по четырём соседним клеткам. Это оценка: диагональное движение, размер юнита, боевые цели, случайный AI волн, другие юниты и последующие правки карты могут изменить реальный путь. Приказы и линии другим игрокам не передаются. На чужом сервере неизвестные клетки fog исключены. Карта до 1024×1024; путь до 8192 клеток; до 12000 видимых отрезков за кадр.
st.routes.enabled = Линии маршрутов
st.routes.ground = Наземные
st.routes.legs = Шагающие
st.routes.naval = Водные
st.routes.hover = Парящие
st.routes.refresh = Пересчитать
st.routes.off = Линии выключены
st.routes.changed = Карта изменилась — обновление
st.routes.too-large = Карта превышает предел прогноза: 1048576 клеток.
st.routes.no-spawns = Нет точек появления
st.routes.no-targets = Нет ядер-целей
st.routes.snapshot = Чтение карты
st.routes.calculating = Поиск путей
st.routes.ready = Прогноз готов. Незавершённая линия не гарантирует достижимость цели.
st.routes.limited = Достигнут предел времени или числа клеток; часть путей может отсутствовать.
st.routes.failed = Прогноз отменён или не выполнен. Пересчитайте после окончания изменений карты.
st.routes.summary = Завершённых путей: {0}/{1}; рассмотрено клеток: {2}.
