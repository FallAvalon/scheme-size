st.console.stop = Остановить
st.console.output = Последний результат
st.console.confirm-run = Выполнить введённый JavaScript локально на хосте? Код имеет полный доступ к игре и вашим файлам.
st.console.confirm-repeat = Запустить повторяющееся выполнение JavaScript локально на хосте? Код имеет полный доступ к игре и вашим файлам. Задачи останавливаются при смене карты или потере прав.
st.console.error.script = Введите непустой скрипт длиной не более 8192 символов.
st.console.error.interval = Укажите интервал 1–3600 секунд; одновременно допускается до восьми задач.
