st.console.title = Локальная JavaScript-консоль хоста
st.console.warning = Код исполняется локально с полными правами игрового скрипта в игровом потоке. Он может изменить мир и файлы или остановить игру. Запускайте только понятный вам код. Скрипт автоматически не отправляется на чужой сервер. Повторяющиеся задачи останавливаются при смене карты, потере прав хоста или выходе и не сохраняются.
