st.edition.god = Size God (SG) — тестовая версия
st.player-tools = Действия
st.player-tools-help = Наблюдение и копирование работают локально. Общие изменения доступны только хосту этой игры. Перед каждым действием цель заново находится по постоянному идентификатору.
st.player-copy-name = Копировать имя
st.player-spectate = Наблюдать
