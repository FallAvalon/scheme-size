st.player-core-remove-warning = Удалить осколок ядра этой команды в клетке X/Y? Последнее ядро должно быть пустым. Его потеря может вызвать завершение матча по правилам карты. Отката карты нет.
st.schematic.title = Схемы
st.schematic.help = Общая библиотека: штатные схемы и копии в отдельной папке мода. Захват до 512×512 клеток. Большие файлы используют .mtls со штатным содержимым msch; ванильное чтение файла ограничено 128. Постройка идёт через обычный ввод игры и права сервера. Исходный файл при импорте сохраняется.
st.schematic.tag = Фильтр по тегу
st.schematic.tags = Теги через запятую
st.schematic.name = Название
st.schematic.unnamed = Без названия
