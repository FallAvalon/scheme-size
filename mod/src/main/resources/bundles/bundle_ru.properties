st.layout.title = Раскладки панели организатора
st.layout.help = До 16 локальных именованных раскладок: позиция/видимость HUD, включённые модули, визуальные слои и камера. Без правил мира, события, приватности, distributor и клавиш. Загрузка с подтверждением останавливает локальные AI, консоль, строительство и вставку ландшафта; маршруты выключаются. Пресеты события и ресурсов хранятся отдельно.
st.layout.save = Сохранить текущую раскладку
st.layout.confirm-save = Сохранить или заменить раскладку «{0}»?
st.layout.confirm-load = Загрузить раскладку «{0}»? Локальные фоновые задачи остановятся. Правила мира и активное событие сохранятся.
st.layout.confirm-delete = Удалить раскладку «{0}»?
st.layout.invalid = Неверная раскладка, имя или сохранённый формат. Раскладка не применена.
st.settings.help = Настройки мода по разделам. Параметры сохраняются сразу. Скрытие панели не останавливает событие.
st.settings.hud-left = Отступ HUD слева
st.settings.hud-top = Отступ HUD сверху
st.settings.modules = Показывать модули
st.settings.reset = Сбросить настройки Scheme-Size
st.settings.reset-confirm = Сбросить HUD, переключатели модулей и клавиши этого мода? Схемы и пресеты событий сохранятся.
st.keys.panel = Открыть главную панель
st.keys.help = По умолчанию клавиши не назначены. Нажмите клавишу с Ctrl, Alt или Shift при необходимости. Игра может одновременно выполнить свою команду даже с модификатором. Escape отменяет ввод.
