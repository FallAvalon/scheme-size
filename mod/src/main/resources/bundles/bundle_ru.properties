st.schematic.import-file = Из файла
st.schematic.import-base64 = Из буфера
st.schematic.export-file = Экспорт в новый файл
st.schematic.export-base64 = Копировать Base64
st.schematic.save-copy = Сохранить копию
st.schematic.saved = Копия сохранена в общей библиотеке мода.
st.schematic.at-player = Вокруг игрока
st.schematic.capture = Копировать
st.schematic.details = Размер {0}×{1}; записей {2}.
st.schematic.preview-hint = Ограниченный цветовой предпросмотр; плотные схемы показаны выборочно. При размещении зданий используется полный штатный просмотр игры.
st.schematic.use = Разместить на карте
st.schematic.terrain-help = Вставка ландшафта — прямое действие ХОСТА, до 4096 клеток за операцию. X/Y — нижняя левая клетка. Неуказанные слои сохраняются; препятствия не могут заменять здания. Отмена возвращает клетки, но не боевые события и изменения предметов из-за ландшафта.
st.schematic.terrain-apply = Проверить и вставить ландшафт
st.schematic.unreadable = Пропущено файлов библиотеки: {0}. Они нечитаемы либо превышают общий предел предпросмотра. Исходные файлы сохранены.
st.schematic.layer.buildings = Здания
st.schematic.layer.plans = Планы
