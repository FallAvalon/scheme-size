st.ai.title = Локальный AI игрока
st.ai.help = Управляет только вашим текущим юнитом через обычный ввод игрока. Клавиши движения, смерть, смена юнита или карты отключают AI. Он может застрять на препятствиях. На чужом сервере действуют обычные правила движения, строительства, добычи и сдачи предметов; сервер может отклонить запрос. Помощь копирует до 16 видимых планов союзника в пустую очередь.
