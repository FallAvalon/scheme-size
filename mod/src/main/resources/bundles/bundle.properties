st.editor.resize = Extended editor resize
st.editor.resize-help = Available only while the native map editor is open and no network session is active. Range 50–5000 per side; available JVM memory imposes a lower total-cell limit. Resizing runs through MapEditor and can take time. The estimate is conservative and cannot guarantee sufficient GPU/OS memory. This does not change native editor limits globally.
st.editor.resize-warning = Resize the current editor buffer? Cropped cells and editor undo history can be lost. Export a backup using the native editor first. This operation does not save the map automatically.
st.editor.resize-error = Editor is unavailable, coordinates are invalid or the estimated memory budget is exceeded. Reduce the map size.
st.peer.unknown = No mod metadata
st.peer.share = Exchange edition/subtitle metadata with a compatible host
st.peer.help = Optional edition/subtitle exchange, disabled by default, including the bounded O279 legacy wire adapter. A peer label is self-reported, never identity or authority. Vanilla clients ignore these packets and need no mod. No response means unknown. Original O279 binary interoperability requires a compatible game build.
st.unit-tools = Units on the map
st.unit-tools-help = Nearest 100 matching units. Native possession requires an unoccupied controllable unit on your team and permission from the server. Host removal is separate. Search by type or numeric ID, then select a unit.
