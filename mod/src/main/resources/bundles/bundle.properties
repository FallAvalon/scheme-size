st.routes.title = Enemy route forecast
st.routes.help = LOCAL LINES — common to Plus and God. Forecast from up to 32 spawn tiles to known enemy cores using Build 160.7 terrain costs and four-neighbour cell paths. This is an estimate: diagonal movement, hit size, combat targets, random wave AI, other units and later map changes can change actual movement. No orders or lines are sent to other players. Unknown fog cells are excluded on remote clients. Maps up to 1024×1024; routes up to 8192 cells; up to 12000 visible line segments per frame.
