st.claj.error.link = Invalid legacy CLaJ link, host or port.
st.claj.error.data = Invalid or excessive relay packet.
st.claj.error.host = Start your own game host first, check the local port and room limit. Joining is disabled while hosting.
st.claj.error.network = Relay failed, disconnected, timed out or uses another protocol. Close the room and check its address/service version. Direct game hosting remains available.
