st.update.download-warning = Download this candidate from the selected source? Downloading does not install it.
st.update.install-warning = Install this executable mod through the game's mod manager? This grants code the same access as other Java mods. Confirm the source and edition. A restart is required. Keep a backup of the previous JAR.
