st.claj.local-port = Actual local game host port
st.claj.create = Create relay room
st.claj.create-warning = Contact this external relay and create a room forwarding to your local game host? The service sees connection addresses and relayed traffic. Verify its operator and the actual local host port. Only create rooms for your own running host.
