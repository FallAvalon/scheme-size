st.update.title = Check/install update
st.update.help = No release channel is published for this project yet. Enter a GitHub owner/repository only when its owner and artifact are trusted. Checking is manual and contacts GitHub; downloading and installing require separate confirmation. The release must contain this edition's JAR and a SHA-256 digest. You can also inspect and import a local JAR. Close this window to ignore an in-progress result.
st.update.source = GitHub owner/repository
st.update.check = Check latest release
st.update.local = Inspect a local update JAR
st.update.busy = Working…
