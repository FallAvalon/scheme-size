st.keys.original = Assign primary O279 keys
st.keys.original-warning = Assign F12 panel, Y visual tools, G quick schematics, F7 core, I AI, F2 units, F3 own player tools, F4 resources? These keys can overlap vanilla or other mods. Native bindings are not removed. Review conflicts below and reassign keys if needed. This replaces these mod shortcuts only.
st.settings.distributor = Controlled distributor on host (restart required)
st.settings.distributor-warning = After restart, distributors created on this host can be controlled like routers. Directional transfer is restricted to adjacent allied buildings that accept the item. Existing saves use the same native serialization. Vanilla guests do not gain a new control button. The factory adapter may conflict with other mods changing distributors. Disable and restart to restore native behavior.
st.unit-tools-control-building = Request control of the allied building at X/Y
st.claj.title = CLaJ rooms (conditional integration)
st.claj.help = Requires an external relay implementing the legacy CLaJ envelope. No public relay is preselected. CLaJ links require a compatible client/adapter; ordinary vanilla guests should use the normal direct IP/Steam lobby path. Relay connections are not encrypted by this integration. Current service compatibility and WAN are unverified. Closing this window leaves created rooms active until explicitly closed or the host session ends. At most 4 rooms and 16 bridges per room; traffic is forwarded over TCP to the real loopback host socket.
